name: Test SaaS MVP

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-saas.txt
      - name: Compile Python modules
        run: python -m compileall -q app_config.py saas_quota.py saas_api.py saas_video_engine.py saas_web.py run_saas.py
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
